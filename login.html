<!DOCTYPE html>

<!-- WePlay - Login Page -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Log in to your WePlay account.">
    <title>WePlay - Login</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="startLogin()">

    <!--  logo  -->
    <header id="top">
        <img src="images/weplay-img.jpg" alt="WePlay logo" width="300" height="90" usemap="#logomap">
        <map name="logomap">
            <area shape="rect" coords="0,0,300,90" href="aboutUs.html" alt="About Us">
        </map>

        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="current">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="aboutUs.html">About Us</a></li>
            </ul>
        </nav>
    </header>

    <div class="main">

        <!-- Login form -->
        <section class="box form-box">
            <h2>Welcome Back</h2>
            <p>Log in to follow your favorite clubs and matches.</p>

            <form id="loginForm" action="#" method="post">

                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="email" class="field"
                       placeholder="example@email.com" autofocus required>
                <span class="error" id="loginEmailError"></span>
<br><br>
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" class="field"
                       placeholder="Enter your password" required>
                <span class="error" id="loginPasswordError"></span>

                <p>
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" class="inline-label">Remember me</label>
                </p>

                <input type="submit" value="Login" class="form-btn">
            </form>

            <p class="form-note">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </p>
        </section>

    </div>

    <!-- nav -->
    <footer>
        <p>&copy; 2026 WePlay - CPIS-358 Project</p>
        <p>
            <a href="index.html">Home</a> |
            <a href="login.html">Login</a> |
            <a href="signup.html">Sign Up</a> |
            <a href="aboutUs.html">About Us</a>
        </p>
    </footer>

    <!-- External JavaScript  -->
    <script src="js/script.js"></script>
</body>
</html>
